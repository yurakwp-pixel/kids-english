<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chomp's English Playground</title>
  <link rel="icon" href="data:,"><!-- 빈 아이콘: /favicon.ico 404 요청을 만들지 않는다 -->
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <!-- 아이 화면: 외부 리소스 없음(CDN·웹폰트·이미지 URL 없음). 그림은 인라인 SVG 와 이모지(시스템 글꼴). -->
  <div id="app" data-mode="idle">
    <main class="play">
      <section class="stage">
        <!-- 🏠 는 지금은 자리만 있다(눌러도 아무 일 없음). -->
        <button id="home" class="home" type="button" aria-label="Home">🏠</button>
        <!-- (?) 힌트: 직전 답의 korean_hint 를 아래에 크게 보여 준다. 서버는 부르지 않는다. -->
        <button id="ask" class="ask" type="button" aria-label="Hint" aria-disabled="true">?</button>
        <!-- 놀이판. viewBox 1200x600 은 layout.js 의 기본 view 와 같다. 캐릭터 발끝은 y=348(무대 줄), 앞마당 줄은 384~528.
             배경(하늘·구름·언덕·풀밭)만 여기 있고, 멍멍이·아기 공룡·물건은 render.js 가 .scene-layer 에 그린다. -->
        <svg id="board" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="330">
              <stop offset="0" stop-color="#bfe7ff"/>
              <stop offset="1" stop-color="#eef9ff"/>
            </linearGradient>
            <linearGradient id="grass" gradientUnits="userSpaceOnUse" x1="0" y1="318" x2="0" y2="600">
              <stop offset="0" stop-color="#a3dd7f"/>
              <stop offset="1" stop-color="#84cc60"/>
            </linearGradient>
          </defs>
          <!-- 하늘과 땅은 viewBox 밖까지 넓게 칠해서 화면 비율이 달라도 빈 띠가 생기지 않게 한다 -->
          <rect x="-3000" y="-2000" width="7200" height="2330" fill="url(#sky)"/>
          <g fill="#fff" opacity=".9">
            <circle cx="190" cy="92" r="30"/><circle cx="230" cy="80" r="40"/><circle cx="274" cy="96" r="26"/>
            <circle cx="760" cy="64" r="22"/><circle cx="790" cy="54" r="30"/><circle cx="824" cy="66" r="20"/>
          </g>
          <ellipse cx="240" cy="336" rx="430" ry="66" fill="#bde6a2"/>
          <ellipse cx="980" cy="340" rx="470" ry="76" fill="#bde6a2"/>
          <rect x="-3000" y="318" width="7200" height="2400" fill="url(#grass)"/>
          <rect x="-3000" y="318" width="7200" height="5" fill="#8fd16a"/>
        </svg>
      </section>

      <div id="bubble" class="bubble"><p id="say" lang="en">Hi! I'm Chomp! Let's talk!</p></div>

      <div class="controls">
        <p id="heard" class="heard" lang="en" hidden></p>
        <button id="mic" class="mic" type="button" aria-label="Talk">🎤</button>
        <p id="unsupported" class="unsupported" lang="ko" hidden>Edge나 Chrome에서 열어 주세요</p>
        <div class="aside">
          <!-- 한국어 힌트: 말풍선 밖(말풍선 안은 언제나 영어). (?) 를 누르면 보인다. -->
          <p id="hint" class="hint" lang="ko" hidden></p>
          <p id="notice" class="notice" lang="ko" hidden></p>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
